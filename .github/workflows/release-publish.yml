name: Publish on Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: ${{ github.event.release.prerelease == false && github.event.release.draft == false }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate release tag version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="${TAG}"
          if [[ "${TAG}" =~ ^([0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}.0.0"
          elif [[ "${TAG}" =~ ^([0-9]+)\.([0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.0"
          fi
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Release tag: ${GITHUB_REF_NAME}"
          echo "Expected package.json version: ${VERSION}"
          echo "Current package.json version: ${CURRENT_VERSION}"
          if [[ "${CURRENT_VERSION}" != "${VERSION}" ]]; then
            echo "::error::package.json version (${CURRENT_VERSION}) does not match release tag (${VERSION})"
            exit 1
          fi

      - name: Publish to npm with trusted publishing
        run: npm publish --access public

      - name: Update release body with publish links
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');

            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const packageName = pkg.name;
            const version = pkg.version;
            const npmUrl = `https://www.npmjs.com/package/${packageName}/v/${version}`;
            const releaseUrl = context.payload.release.html_url;
            const marker = '<!-- auto-publish-links -->';

            const section = [
              marker,
              '### 自动发布',
              `- npm: [${packageName}@${version}](${npmUrl})`,
              `- Release: [查看 Release](${releaseUrl})`,
            ].join('\n');

            const originalBody = context.payload.release.body || '';
            const beforeMarker = originalBody.split(marker)[0].trimEnd();
            const body = beforeMarker ? `${beforeMarker}\n\n${section}` : section;

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id,
              body,
            });

      - name: Summary
        shell: bash
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          {
            echo "## 发布完成"
            echo "- 包版本: ${VERSION}"
            echo "- npm: https://www.npmjs.com/package/${PKG_NAME}/v/${VERSION}"
            echo "- Release 页面: ${{ github.event.release.html_url }}"
            echo "- 认证模式: trusted publishing (OIDC)"
          } >> "$GITHUB_STEP_SUMMARY"
